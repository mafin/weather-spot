apiVersion: apps/v1
kind: Deployment
metadata:
  name: weatherspot
  labels:
    app.kubernetes.io/name: weatherspot
    app.kubernetes.io/component: web
    app.kubernetes.io/part-of: weatherspot
spec:
  replicas: 2
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      # Never drop below the desired count during a rollout
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: weatherspot
      app.kubernetes.io/component: web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: weatherspot
        app.kubernetes.io/component: web
        app.kubernetes.io/part-of: weatherspot
    spec:
      # The app never talks to the Kubernetes API
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30

      securityContext:
        runAsNonRoot: true
        # Matches the nextjs:nodejs user baked into the Dockerfile
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault

      # Spread replicas across nodes when the cluster has more than one,
      # but still schedule if it does not (single-node home labs).
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: weatherspot
              app.kubernetes.io/component: web

      containers:
        - name: weatherspot
          # Real registry path is set in kustomization.yaml
          image: weatherspot:0.2.0
          # Required because the tag is ":latest", which moves. With
          # IfNotPresent a node that already cached the layer would keep serving
          # the old build forever. Switch to IfNotPresent if you move to
          # immutable version tags.
          imagePullPolicy: Always

          ports:
            - name: http
              containerPort: 3000
              protocol: TCP

          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: "3000"
            - name: HOSTNAME
              value: 0.0.0.0
            - name: NEXT_TELEMETRY_DISABLED
              value: "1"

          # Verified: the standalone server runs fine on a read-only root
          # filesystem with only /tmp writable.
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL

          volumeMounts:
            - name: tmp
              mountPath: /tmp

          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              # No CPU limit on purpose: throttling only hurts request latency here.
              # Add one if your cluster policy requires it.
              memory: 256Mi

          # "/" is a statically prerendered page, so probing it is cheap.
          startupProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3

      volumes:
        - name: tmp
          emptyDir: {}
