apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: weatherspot

resources:
  - namespace.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml
  - poddisruptionbudget.yaml
  - networkpolicy.yaml
  - hpa.yaml
  - cloudflared.yaml

# includeSelectors must stay false: labels merged into a Deployment's
# spec.selector would land in an immutable field and force a recreate later.
labels:
  - includeSelectors: false
    pairs:
      app.kubernetes.io/managed-by: kustomize

# Single place that decides which image actually gets pulled.
# To pin a real version later:
#   kustomize edit set image weatherspot=docker.io/mafin/weather-spot:0.2.0
images:
  - name: weatherspot
    newName: docker.io/mafin/weather-spot
    newTag: latest
